# 安装：sudo cp 60-dds-buffers.conf /etc/sysctl.d/ && sudo sysctl --system，然后重启整套栈。
# CycloneDDS 收大消息需要大 UDP 接收缓冲。Ubuntu 默认 rmem_max 只有 208 KB，而 Livox 单帧点云
# 200~380 KB；建图/定位进程负载高时内核直接丢包，同一 socket 上的 IMU 随之丢失
# （glog: imu_processing.hpp "get abnormal dt"），快转时航向跳变，地图出现多层墙。
net.core.rmem_max=33554432
net.core.rmem_default=8388608
