# 本机（无 Thor 背包的 G1，Orin 30524）覆盖的 shim 控制器版：= nav2_params.local.yaml 的全部内容 + controller_server.FollowPath 换成
# aid_nav_shim_controller（离目标 >= 0.6 m 用 MPPI 跟线 + 局部避障，< 0.6 m 用 RPP 到点 + 原地转；参考轮式 128.23）。
# 部署时拷到 /opt/G1/nav2_params.shim.local.yaml；用 /opt/G1/nav_controller_switch.sh shim|rpp 在两份覆盖之间切换（改 local.env 的
# nav_params_overlay），切换后要重启 g1-robot。nav2_params.local.yaml 改了的话，这里对应的部分要同步改（两份互不引用）。
# 仿真依据：src/test/nav_goal_sim/run_shim_test.py、run_track_test.py（2026-10-26，见该目录 README）。
bt_navigator:
  ros__parameters:
    # 同 nav2_params.local.yaml：恢复轮换里多一个 BackUp
    default_nav_to_pose_bt_xml: $(find-pkg-share aid_navigation2)/behavior_trees/navigate_w_recovery_backup_and_replanning_only_if_path_becomes_invalid.xml

controller_server:
  ros__parameters:
    goal_checker:
      # 同 nav2_params.local.yaml
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.30
    FollowPath:
      plugin: "aid_nav_shim_controller::NavShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      near_goal_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      near_goal_distance: 0.6
      near_goal_exit_hysteresis: 0.3
      near_goal_fallback_to_primary: true
      # 新目标起步时朝向偏离路径 > 45° 先原地转（转速同 RPP 本机值 0.9）；行驶中不检查（会和 MPPI 绕障来回抢）
      rotate_to_heading: true
      rotate_only_on_new_goal: true
      rotate_start_angle: 0.785
      rotate_stop_angle: 0.3
      rotate_angular_vel: 0.9
      max_angular_accel: 3.2
      forward_sampling_distance: 0.6
      # 卡住检测：MPPI 阶段沿路径剩余长度 10 s 内没缩短 0.25 m 就报失败，交给行为树恢复
      stall_timeout: 10.0
      stall_min_progress: 0.25
      stall_detour_reset: 0.3

      # ---- primary：MPPI，参数照抄 aid_navigation2/param/nav2_params.yaml 的 FollowPathMPPI（注释见那里） ----
      # 与 RPP 同名的 max_robot_pose_search_dist / transform_tolerance 也落在 FollowPath.* 下，这里是 MPPI 的值
      time_steps: 40
      model_dt: 0.10
      batch_size: 2000
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.5
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      retry_attempt_limit: 1
      max_robot_pose_search_dist: 2.5
      enforce_path_inversion: true
      # 【硬性安全约束】vx_min 必须为 0（G1 带背包时负 vx 会摔；本机后退只走 BT 的 BackUp）
      vx_max: 0.45
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.9
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.3
      TrajectoryVisualizer:
        trajectory_step: 10
        time_step: 6
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "ObstaclesCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 180.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        inflation_layer_name: ""
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 0.3
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 18.0
        consider_footprint: false
        collision_cost: 100000.0
        collision_margin_distance: 0.20
        near_goal_distance: 0.5
        # 必须与 local_costmap 的 inflation_layer 一致
        inflation_radius: 0.85
        cost_scaling_factor: 8.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.3
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      # ---- near：RPP（离目标 < 0.6 m），= nav2_params.yaml 的 FollowPath + nav2_params.local.yaml 的本机值 ----
      near:
        desired_linear_vel: 0.40
        lookahead_dist: 0.6
        min_lookahead_dist: 0.4
        max_lookahead_dist: 0.9
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: false
        max_robot_pose_search_dist: 1.0
        transform_tolerance: 0.1
        allow_reversing: false
        use_rotate_to_heading: true
        # 同 nav2_params.local.yaml（10-25 0.35 -> 0.9）
        rotate_to_heading_angular_vel: 0.9
        rotate_to_heading_min_angle: 0.785
        max_angular_accel: 3.2
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.25
        use_cost_regulated_linear_velocity_scaling: false
        cost_scaling_dist: 0.6
        cost_scaling_gain: 1.0
        inflation_cost_scaling_factor: 8.0
        approach_velocity_scaling_dist: 0.6
        min_approach_linear_velocity: 0.05
        use_fixed_curvature_lookahead: false
        curvature_lookahead_dist: 0.6
        interpolate_curvature_after_goal: false
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      # 同 nav2_params.local.yaml：走路蟹行补偿，controller（含 shim 的 MPPI / RPP）取的位姿来自 base_link_nav
      robot_base_frame: base_link_nav

velocity_smoother:
  ros__parameters:
    # 同 nav2_params.local.yaml：让 BackUp 的后退速度通过；MPPI vx_min 0、RPP allow_reversing false，正常行走不会给负 vx
    min_velocity: [-0.3, 0.0, -0.9]
