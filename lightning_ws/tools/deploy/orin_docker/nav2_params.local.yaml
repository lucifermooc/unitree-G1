# 本机（无 Thor 背包的 G1，Orin 30524）覆盖 aid_navigation2/param/nav2_params.yaml，部署时拷到 /opt/G1/nav2_params.local.yaml，
# 由 G1_ROBOT_ARGS 的 nav_params_overlay:=/opt/G1/nav2_params.local.yaml 加载（g1_navigation_direct.launch.py 按键递归合并，列表整体替换）。
# 仓库默认值按带 Thor 背包的 G1 定，不要把这里的值改回仓库。数据见 CLAUDE.md 2.6。
bt_navigator:
  ros__parameters:
    # 恢复轮换里多一个 BackUp（直线后退 0.25 m 脱困）。2026-10-24 该机实测 -0.2 / -0.3 稳定后退、-0.1 不动。
    default_nav_to_pose_bt_xml: $(find-pkg-share aid_navigation2)/behavior_trees/navigate_w_recovery_backup_and_replanning_only_if_path_becomes_invalid.xml

controller_server:
  ros__parameters:
    goal_checker:
      # 0.10 -> 0.20：该机原地转绕右侧约 0.28 m 的点画圈，目标在圈心附近时进不了 0.10（10-24 11:42 绕 2.5 min）。
      # 10-24 19:26 机器上再放到 0.3；同时在 install 里就地改了 yaw 0.30，10-25 部署前挪进本文件（防止被部署冲掉）。
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.30
    FollowPath:
      # 0.6 -> 0.35（>= 桥接 min_wz 0.32）：该机 |wz| <= 0.29 完全不转，0.6 转过头。
      # 10-25 0.35 -> 0.6 -> 0.9：0.35 时逆时针原地转漂 0.26~0.67 m（腿式里程计，4 次），转进 0.50 内切带锁死。
      # motion_test_1025_2027（从静止转 120°，里程计）：逆时针 0.6 -> 0.22~0.33 m、0.8 -> 0.15~0.20、1.0 -> 0.08~0.10；
      # 顺时针 0.6/0.8/1.0 都在 0.06~0.15。0.9 = velocity_smoother max_velocity[2] 上限。过冲 1~7°。
      rotate_to_heading_angular_vel: 0.9

local_costmap:
  local_costmap:
    ros__parameters:
      # 走路蟹行补偿：controller / RPP / goal_checker 取的机器人位姿来自 local costmap 的 robot_base_frame。
      # base_link_nav 由 g1_crab_comp_frame 发布（= base_link 走路时转 +10°，停下 / 原地转时 = base_link），
      # 随 g1_navigation.launch.py 的桥一起起。global costmap / planner / behavior_server / bt_navigator 仍用 base_link。
      robot_base_frame: base_link_nav

velocity_smoother:
  ros__parameters:
    # x 下限 0 -> -0.3：让 BackUp 的后退速度通过（= 桥接 max_reverse_vx）。RPP allow_reversing 仍为 false，正常行走不会给负 vx。
    min_velocity: [-0.3, 0.0, -0.9]
