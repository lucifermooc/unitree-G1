# 本机（无 Thor 背包的 G1，Orin 30524）覆盖 g1_nav_bridge/config/nav_bridge.yaml，部署时拷到 /opt/G1/nav_bridge.local.yaml，
# 由 G1_ROBOT_ARGS 的 bridge_params_overlay:=/opt/G1/nav_bridge.local.yaml 加载，同名参数以它为准。数据见 CLAUDE.md 2.6。
g1_cmdvel_to_sport:
  ros__parameters:
    # 2026-10-24 实测 |wz| <= 0.29 完全不转、0.30 起转（实际约 0.7~0.8 倍），0.6 -> 0.32。
    min_wz: 0.32
    # 2026-10-25 走路时（vx >= vx_stop）wz 不抬速、原样透传。motion_test_1025_2031（vx 0.4，直接调 SetVelocity）：
    # 走路时没有原地转那样的死区，wz 0.10 -> 实测 0.054~0.066、0.20 -> 0.13、0.30 -> 0.21~0.23，基本线性。
    # 之前从导航包推出的"走路时 |wz|<0.15 不转"是测量方法错了（指令每 0.1 s 正负切换）；按它把 wz_stop 降到 0.05
    # 那轮跟线更差（p95 0.21 -> 0.25 m），已改回 0.15（现在只决定原地时多小的 wz 算停）。
    walk_min_wz: 0.0
    wz_stop: 0.15
    # 2026-10-24 实测后退：-0.1 不动，-0.2 退 0.12 m / 1.5 s，-0.3 退 0.25 m / 1.5 s，倾斜 <= 3.8°，没摔。
    # 只给 BT BackUp 脱困用（= nav2_params.local.yaml 的 velocity_smoother min_velocity[0]），只允许直线后退。
    max_reverse_vx: 0.3
    min_reverse_vx: 0.25

g1_crab_comp_frame:
  ros__parameters:
    # 走路蟹行：只发 vx 时实际行进方向比机体航向偏左约 10°（motion_test_1025_2031 wz=0 直走：定位 +11.1°、
    # 里程计对骨盆 IMU +10.3°）。发 base_link_nav = base_link 转 +10°（走路时），local costmap / RPP 按行进方向追线。
    # 仿真（src/test/nav_goal_sim/results/track_20261025_2102*，照搬 crab_comp.hpp，只改 local costmap 的帧，A+B 同开）：
    # 对照 A+B 横向偏差 p50 0.10 m、偏一侧均值 +0.11；加本节点后 p50 0.064 / p95 0.19、均值 ±0.03，36 段全成功、锁死 0。
    crab_deg: 10.0
