# G1：驱动对点云和内置 IMU 同时做 Rx(pi)，平移为零。
# Unitree G1 + Livox MID-360 first-run configuration
common:
  dataset: "livox" # 在线订阅由下列 topic 和 lidar_type 决定；离线工具需单独检查枚举
  lidar_topic: "points_raw"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/livox/imu"

# fasterlio 参数
fasterlio:
  lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
  scan_line: 4
  # 盲区，小于盲区距离的不会处理。G1 雷达正下方 0.25 m 内是机身回波（每帧约 40% 的点），进 LIO 会让它少算位移、
  # 进 NDT 会把定位拉偏 0.4 m 以上（2026-10-08，0930b 包）；0.25~0.6 m 实测没有点，取 0.4 留余量。
  # 注意 2026-10-08 之前 pointcloud_preprocess.cc 的盲区判断有运算符优先级 bug，这个值实际从未生效。
  blind: 0.4
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情况
  point_filter_num: 2 # 初始值：减少抽点，保留小障碍细节，需实测处理耗时
  max_iteration: 4 # 最大迭代次数
  filter_size_scan: 0.1 # 初始值：避免 0.5 m 降采样损失低矮障碍物细节
  filter_size_map: 0.2

  ivox_grid_resolution: 0.5        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: false  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  # p_imu = R * p_lidar + T：传感器内部外参，不是雷达到躯干的外参。
  # 原始 T=[-0.011,-0.02329,0.04412]；两路同时 Rx(pi) 后 T'=Rx(pi)*T。
  # 仅适用于当前驱动 roll=180,pitch=yaw=0,x=y=z=0。
  # Unitree 官方：Mid360 内部 IMU 相对雷达的平移为 (0.011, 0.02329, -0.04412) m，无旋转。
  # FastLIO 的 extrinsic_T 是雷达原点在 IMU 系下的坐标，即上式取负。
  # 2026-09-17 之前这里只对 x 取了负号、y/z 未取，三个分量不自洽。
  extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false
  # LIO 世界系对齐重力（z 向上）。关闭时世界系=首帧 IMU 系，雷达倾斜多少地图就倾斜多少，
  # 会破坏 g2p5 按高度切 2D 栅格和 lidar_loc.gravity_constrain 的前提。定位只用 LIO 相对位姿，不受影响。
  gravity_align_init: true
  kf_dis_th: 1.0
  kf_angle_th: 10.0

  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 500
  imu_filter: false
  proj_kfs: false


g2p5:
  esti_floor: true   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.30  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.05 # 栅格地图分辨率

system:
  with_loop_closing: true # 是否需要回环检测
  with_ui: true # 是否需要3D UI
  with_2dui: false # 是否需要2D UI
  with_g2p5: true # 是否需要栅格地图
  step_on_kf: false # 是否在关键帧处暂停

  # 激光定位只在 LIO 关键帧做（lidar_loc.loc_on_kf: true），不跳帧。
  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ~/maps/new_map/
  map_save_root: ~/maps
  pub_tf: true

loop_closing:
  loop_kf_gap: 20       # 每隔多少个关键帧检查一次
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 50     # 历史关键帧与当前帧的ID间隔
  max_range: 20.0       # 候选帧的最大距离
  ndt_score_th: 1.3     # ndt位姿分值
  # 回环源点云用候选帧前后各 N 个关键帧拼的局部子图（0 = 只用单帧稀疏扫描）。2026-09-19 用 map500d_0919 离线对比：
  # 单帧时同一处回环修正在 0.7~2 m 间跳动、左上角墙体分层；N=20 时回环 43→75 个、离群 2→0、平均修正 0.07 m / 0.7°，墙体单线。
  src_submap_range: 20
  # 回环只采用 NDT 的 x/y/航向修正，横滚/俯仰/高度保持 LIO（IMU 重力已约束）。2026-09-19 14:02 在线建图：
  # 6 自由度回环边带 1~2.5° 假倾斜，优化后右侧房间整段被抬高 ~1 m、墙体分层；map500d 离线开启后高度修正为 0，墙体仍单线。
  loop_4dof: true
  with_height: false


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  # 用 LIO 重力约束 NDT 结果的 roll/pitch（保留 NDT 航向与平移）。
  # 2026-09-18：G1 站立处周围遮挡多，6DoF NDT 在 tilt 上退化，静止时 roll 被拉到 -7~-9°。
  # 目标方向取 <map>/gravity_up.txt（地图系重力上方向，旧地图用地面+墙面法向实测）；缺省为 +z。
  gravity_constrain: true
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  # 只在 LIO 关键帧做激光定位（原版行为）。2026-09-19 用 map_0919_1438 包离线对比：改成每帧定位（false）时，
  # NDT 结果沿行进方向系统性落后 0.13 m，被高频融合后累积成 7.6 m / 62° 漂移；true 时同数据 1.3 m / 7°。
  # 启动慢收敛由 fast_converge_*（收敛前每帧定位）解决，不需要全程每帧定位。
  loc_on_kf: true
  try_self_extrap: false
  # NDT 结果与 LO 预测的融合比例（旧代码硬编码 0.1），需新版 lidar_loc.cc 才生效，旧二进制忽略这些键。
  balance_factor: 0.1
  # 初始化后的快速收敛：NDT 分值 >= fast_converge_min_score 时按 fast_converge_factor 融合，
  # 连续 fast_converge_ok_frames 次残差 < fast_converge_ang_deg 且 < fast_converge_pos 后恢复 balance_factor。
  # 本图正确匹配分值 1.65~1.87（2026-09-19 09:19 日志），低于门限的匹配保持旧的 10% 慢融合。
  fast_converge_factor: 0.5
  fast_converge_min_score: 1.5
  fast_converge_ang_deg: 0.5
  fast_converge_pos: 0.05
  fast_converge_ok_frames: 3
  fast_converge_max_frames: 50
# 定位一致性守护（lidar_loc/loc_guard.h）。2026-09-29 实测：NDT 在走廊两个局部最优间来回跳，
# 每帧只注入 10% 残差，几分钟累积 ~2 m / 19°，而 LIO 85 分钟回原点只差 9 cm。这里在窗口内比较
# "输出相对运动"与"LIO 相对运动"，差值（NDT 注入的累积修正）超限且腿式里程计不反对 LIO 时冻结修正。
# 当天正常波动 <= 0.19 m，出事时 0.64 m。
# 2026-09-29 离线 A/B（locguard_0929 包注入 0.55 m NDT 偏差）：freeze 把 16 m 漂移压到 5 m 但挡不住——
# 里程计阈值过紧（正常行走 18% 窗口误判不一致）导致冻结/解冻来回切约 100 次，冻结后也无法自动恢复。
# 根因是走廊尽头地图双解（横向偏 0.1 m 纵向解跳 0.5 m），先重建地图；守护暂只告警 + /lightning/loc_status 观察。
# 2026-09-30 新图实测：导航（~0.3 m/s、两端快速转身）下 NDT 把输出沿走廊拉走 1.5~2.2 m，全程 LIO 与腿式里程计互差 ~0.1 m；
# 守护每次都判对了。改为 freeze + rollback：判定后冻结修正，并把窗口内已注入的修正退回（输出 = 参考帧修正量 × 当前 LIO），
# 里程计阈值放宽到 09-29 实测 p95 并要求连续 odom_persist_frames 帧才改判（原阈值导航转身时来回切 ~70 次）。
loc_guard:
  enabled: true
  action: freeze            # freeze = 冻结修正只跟 LIO；warn = 只告警
  rollback: true            # 冻结时退回窗口内累积的修正（false = 只冻结，停在已被拉偏的位置）
  window_sec: 60.0          # 静止时的慢拉（09-30 14:51，40 s 拉走 0.19 m）要长窗口才看得出
  window_dist: 5.0
  max_drift_m: 0.20         # 手动慢走时窗口内修正 <= 0.18 m；导航出事时几秒内就过 0.2
  max_drift_deg: 5.0
  static_travel_m: 0.30     # 窗口内 LIO 路程 < 该值视为静止
  max_drift_static_m: 0.10  # 静止时 LIO 20 min 只漂 ~5 cm，NDT 不该有明显修正
  recover_frames: 10        # 连续 N 帧 NDT 残差 < recover_res_* 后恢复
  recover_res_m: 0.15
  recover_res_deg: 2.0
  reloc_hint_frames: 30     # 冻结超过 N 帧仍未恢复，/lightning/loc_status 提示 need_reloc
  odom_topic: /odom         # g1_nav_bridge/sport_to_odom（navigation 模式才有）；"" 不用里程计
  odom_tol_m: 0.15          # LIO 与里程计一致：误差 < odom_tol_m + odom_tol_ratio * 行程，且航向差 < odom_tol_deg
  odom_tol_ratio: 0.15      # 09-29 实测误差/行程 p95 10.9%、航向 p95 6°
  odom_tol_deg: 10.0
  odom_persist_frames: 5    # 里程计连续 N 帧不一致才怪 LIO（连续 N 帧一致才从 LIO_SUSPECT 改判 NDT）
  # 单帧跳变检查：NDT 结果离 LIO 预测超过该值（平面距离 / yaw）本帧不采信。LIO 一帧内误差只有厘米级；
  # 09-30 离线统计导航段 NDT 原始残差 >0.3 m 占 25~46%。代价：累计误差超过该值后 NDT 拉不回来（等同纯 LIO）。0 = 关闭
  max_ndt_jump_m: 0.2
  max_ndt_jump_deg: 3.0
  init_yaw_search_deg: 15.0 # /initialpose 重定位时在给定航向左右搜索的范围；0 = 不搜
  init_yaw_search_step_deg: 3.0
# 送给激光定位（NDT）的点云。上游行为：当前帧 + 最多 5 个历史关键帧各取最早 1001 点（按 LIO 相对位姿摆到当前帧）。
# fasterlio.proj_kfs 管不到这条路径（上游的判断被注释掉了）。2026-09-30 起投影在副本上做并跳过当前帧自身
# （原来原地追加，当前帧是新关键帧时会一边遍历自身一边 push_back）。false = 只用当前帧，用于实机 A/B（开—关—开）。
loc_input:
  proj_kfs: true
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 10.0
  # 原始雷达点云在【雷达坐标系】里的 Z 下限（pointcloud_preprocess.cc:66 直接按 pt.z 裁剪）。
  # MID360 装在 base_link 上方约 1.236 m，地面点在雷达系里 z≈-1.24，因此该值必须为负。
  # 2026-09-17 Thor 实测：此处填 1.1 时只保留雷达上方 1.1 m 以上的点，
  # 每帧 20000 点被裁到【20 点】，LIO 完全失去约束，只能靠 IMU 纯航位推算，
  # 表现为静止时位姿以恒定速度漂走（曾漂到 z≈1158 m）。改为 -2.0 后每帧恢复约 5000 点，
  # ESKF 拒绝次数由 17 降为 0。其余 default_*.yaml 的该值也都是负数（-2.0 / -10.0）。
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 4
