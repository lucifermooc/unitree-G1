# Nav2 到点仿真参数（ROS 2 humble 写法，本机测试用）。
# 控制器 / 到点判定 / 进度检查 / 速度平滑 / 机器人半径与膨胀 一律照抄 aid_navigation2/param/nav2_params.yaml（Thor，jazzy）。
# 与 Thor 的差别：代价地图只有静态层 + 膨胀层（仿真没有传感器、没有禁行区）；humble 的插件名 / progress_checker_plugin 写法。
# 全局规划器不在这里，见 planner_2d.yaml（现状）和 planner_hybrid.yaml（方案二）。

map_server:
  ros__parameters:
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 200
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 10.0
    failure_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: true
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.10
      batch_size: 2000
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.5
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      retry_attempt_limit: 1
      max_robot_pose_search_dist: 2.5
      vx_max: 0.45
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.9
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "ObstaclesCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 180.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        inflation_layer_name: ""
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 0.3
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 18.0
        consider_footprint: false
        collision_cost: 100000.0
        collision_margin_distance: 0.20
        near_goal_distance: 0.5
        inflation_radius: 0.75
        cost_scaling_factor: 8.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.3
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.45, 0.0, 0.9]
    min_velocity: [0.0, 0.0, -0.9]
    max_accel: [0.35, 0.35, 0.60]
    max_decel: [-0.8, -0.35, -0.60]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.20

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # 与 Thor 一样加载 backup（humble 的 bt_navigator 加载默认 through_poses 行为树时要求它存在）；
    # 到点用的行为树里没有 BackUp 节点，不会下发负速度（g1_motion_sim 也会把负速度钳为 0）。
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.9
    min_rotational_vel: 0.8
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.20
      resolution: 0.05
      robot_radius: 0.50
      rolling_window: true
      width: 6
      height: 6
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.75
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 0.20
      resolution: 0.05
      robot_radius: 0.50
      track_unknown_space: true
      unknown_cost_value: 255
      trinary_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        track_unknown_space: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.75
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
