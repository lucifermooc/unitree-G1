# Orin 30524 当前导航配置（叠加在 nav2_sim_params.yaml 之后，humble 写法），给 sim_orin_launch.py 用。
# 来源：aid_navigation2/param/nav2_params.yaml（RPP、smoother、inflation 0.85）+ 当时的 Orin 覆盖文件（10-27 起已收进 nav2_params.yaml 的 FollowPathRPP）
# （rotate_to_heading 0.6、xy 容差 0.3、yaw 容差 0.30）。规划器见 planner_orin.yaml（cost_travel_multiplier 10）。
controller_server:
  ros__parameters:
    goal_checker:
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.30
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.40
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      max_robot_pose_search_dist: 1.0
      transform_tolerance: 0.1
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 8.0
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.05
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_interpolation: true

velocity_smoother:
  ros__parameters:
    max_velocity: [0.45, 0.0, 0.9]
    min_velocity: [0.0, 0.0, -0.9]
    max_accel: [0.35, 0.35, 0.60]
    max_decel: [-2.0, -0.35, -5.0]

local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        cost_scaling_factor: 8.0
        inflation_radius: 0.85

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        cost_scaling_factor: 6.0
        inflation_radius: 0.85
