semantic_map_server:
  ros__parameters:
    qdrant_host: "localhost"
    qdrant_port: 6333
    qdrant_path: ""                     # 非空时用本地文件存向量（不需要 Qdrant 服务），如 "~/maps/semantic_qdrant"
    collection_prefix: "semantic_map"   # 每张地图一个 collection：semantic_map_<map_id>
    model_name: "BAAI/bge-m3"           # 第一次运行自动下载（约 2.3GB）；也可以填本地模型目录
    use_fp16: false                     # CPU 用 false；Thor（CUDA）改成 true
    # 相似度低于这个分数就算"没找到"，机器人不动。0.52 是用 28 句相关 + 15 句无关的话实测定的，
    # 换成真实点位后用前端"试一试"多试几句再调。
    score_threshold: 0.52
    top_k: 3
    # 话题输入：ASR 等模块往这个话题发 std_msgs/String，内容是一句话，或 {"text": "...", "source": "asr"}。
    # 填 "" 关掉。text_in_action：search = 只搜索（结果看 /semantic_map/debug）；go = 找到就导航。
    text_in_topic: "/semantic_map/text_in"
    text_in_action: "go"
    # 调试记录：每次请求一行 JSON（来源、原始文本、问题、得分、结果），填 "" 不写文件。超过 20MB 滚动成 .1
    log_file: "~/maps/semantic_map_log.jsonl"
    history_size: 200                   # /semantic_map/history 返回的最近条数
