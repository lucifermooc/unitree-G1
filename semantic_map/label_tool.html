<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语义地图标注</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #2563eb; --selected: #ea580c; --hit: #16a34a; --warn: #b45309; --danger: #cf222e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         color: var(--text); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel);
           border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--border); background: #f6f8fa;
           border-radius: 6px; cursor: pointer; color: var(--text); }
  button:hover:not(:disabled) { background: #eef1f4; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; }
  button.danger { color: var(--danger); }
  button.active { background: #dbeafe; border-color: var(--accent); }
  #dirty { color: var(--warn); font-weight: 600; }
  main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 1; position: relative; min-width: 0; background: #e9ebee; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #coords { position: absolute; left: 8px; bottom: 8px; background: rgba(255,255,255,.9); padding: 2px 8px;
            border-radius: 4px; font: 12px ui-monospace, monospace; pointer-events: none; }
  #hint { position: absolute; left: 8px; top: 8px; background: rgba(255,255,255,.92); padding: 6px 10px;
          border-radius: 6px; font-size: 12px; color: var(--muted); max-width: 340px; pointer-events: none; }
  aside { width: 360px; background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto;
          padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  section h2 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  input, textarea { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 6px; }
  .row > div { flex: 1; min-width: 0; }
  .buttons { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .warn { color: var(--warn); font-size: 12px; margin-top: 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  #list li:hover { background: #f6f8fa; }
  #list li.sel { border-color: var(--selected); background: #fff7ed; }
  #list .t { font-weight: 600; }
  #list .c { font: 12px ui-monospace, monospace; color: var(--muted); }
  #status { font-size: 12px; min-height: 18px; }
  #status.err { color: var(--danger); }
  #status.ok { color: var(--hit); }
  #searchResult { font-size: 13px; margin-top: 6px; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #mapwrap { height: 55vh; flex: none; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>语义地图标注</h1>
  <span class="muted" id="mapname"></span>
  <span class="spacer"></span>
  <span id="dirty"></span>
  <button id="btnPan" title="触屏设备：打开后单指拖动是平移地图">平移模式</button>
  <button id="btnFit">适应窗口</button>
  <button id="btnSave" class="primary" disabled>保存</button>
  <button id="btnRebuild" title="把保存好的地点重新写进语义库（Qdrant）">重建语义库</button>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="hint">在空地上<b>按住鼠标、朝机器人要面对的方向拖一下再松开</b> → 新建地点。<br>
      点选圆点可编辑，拖动圆点可移动。滚轮缩放，右键拖动平移。</div>
    <div id="coords"></div>
  </div>
  <aside>
    <section>
      <h2 id="formTitle">新地点</h2>
      <div id="formEmpty" class="muted">在地图上拖一下新建地点，或者点选已有地点编辑。</div>
      <div id="form" hidden>
        <label for="fTitle">名称（title）</label>
        <input id="fTitle" placeholder="例如：茶水间">
        <label for="fDesc">描述（description）：写成人会怎么说</label>
        <textarea id="fDesc" placeholder="例如：有饮水机和咖啡机，可以接水、喝水、泡茶"></textarea>
        <div class="row">
          <div><label for="fX">x（米）</label><input id="fX" type="number" step="0.01"></div>
          <div><label for="fY">y（米）</label><input id="fY" type="number" step="0.01"></div>
          <div><label for="fYaw">朝向（度）</label><input id="fYaw" type="number" step="1"></div>
        </div>
        <div id="fWarn" class="warn"></div>
        <div class="buttons">
          <button id="btnAdd" class="primary">添加</button>
          <button id="btnReplace" title="然后在地图上重新拖一下">重新放置</button>
          <button id="btnDelete" class="danger">删除</button>
          <button id="btnCancel">取消</button>
        </div>
      </div>
    </section>
    <section>
      <h2>试一试搜索</h2>
      <div class="row">
        <div><input id="q" placeholder="例如：我想喝水"></div>
        <button id="btnSearch">搜索</button>
      </div>
      <div id="searchResult" class="muted">先"保存"再"重建语义库"，这里搜的才是最新的地点。</div>
    </section>
    <section>
      <h2>全部地点 <span class="muted" id="count"></span></h2>
      <ul id="list"></ul>
    </section>
    <div id="status"></div>
  </aside>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
const FREE_MIN = 250;       // 地图像素：254 空地，205 未知，0 障碍物
const HIT_RADIUS = 12;      // 点选圆点的范围（屏幕像素）

let map = null, mapImage = null;
let places = [];
let selectedId = null;      // 正在编辑的已有地点
let pending = null;         // 还没"添加"的新地点
let replacing = false;      // "重新放置"：下一次拖动改的是选中地点
let searchHitId = null;
let dirty = false;
let panMode = false;
const view = { scale: 1, ox: 0, oy: 0 };
let drag = null;

// ---------- 坐标换算：屏幕像素 ⇄ 地图图片像素 ⇄ 世界坐标（米） ----------
const screenToImg = (sx, sy) => [(sx - view.ox) / view.scale, (sy - view.oy) / view.scale];
const imgToScreen = (u, v) => [u * view.scale + view.ox, v * view.scale + view.oy];
const imgToWorld = (u, v) => [map.origin[0] + u * map.resolution, map.origin[1] + (map.height - v) * map.resolution];
const worldToImg = (x, y) => [(x - map.origin[0]) / map.resolution, map.height - (y - map.origin[1]) / map.resolution];
const worldToScreen = (x, y) => imgToScreen(...worldToImg(x, y));
const round = (v, n = 3) => Math.round(v * 10 ** n) / 10 ** n;
const normYaw = (a) => Math.atan2(Math.sin(a), Math.cos(a));

function cellValue(x, y) {
  const [u, v] = worldToImg(x, y);
  const i = Math.floor(u), j = Math.floor(v);
  if (i < 0 || j < 0 || i >= map.width || j >= map.height) return -1;
  return map.pixelBytes[j * map.width + i];
}
function cellWarning(x, y) {
  const c = cellValue(x, y);
  if (c < 0) return "⚠ 在地图范围外";
  if (c < 100) return "⚠ 这里是墙/障碍物，机器人到不了";
  if (c < FREE_MIN) return "⚠ 这里是未探索区域，机器人可能到不了";
  return "";
}

// ---------- 加载 ----------
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function init() {
  map = await api("/api/map");
  const raw = atob(map.pixels);
  map.pixelBytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) map.pixelBytes[i] = raw.charCodeAt(i);
  const off = document.createElement("canvas");
  off.width = map.width; off.height = map.height;
  const octx = off.getContext("2d");
  const img = octx.createImageData(map.width, map.height);
  for (let i = 0; i < map.pixelBytes.length; i++) {
    const g = map.pixelBytes[i];
    img.data.set([g, g, g, 255], i * 4);
  }
  octx.putImageData(img, 0, 0);
  mapImage = off;
  $("mapname").textContent = `${map.name} · ${map.width}×${map.height} · ${map.resolution} m/像素`;

  const data = await api("/api/places");
  places = data.places;
  resize(); fit(); renderList(); showForm();
  setStatus(`地点文件：${data.data_file}`);
}

// ---------- 绘制 ----------
function resize() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function fit() {
  const r = canvas.getBoundingClientRect();
  view.scale = Math.min(r.width / map.width, r.height / map.height) * 0.92;
  view.ox = (r.width - map.width * view.scale) / 2;
  view.oy = (r.height - map.height * view.scale) / 2;
  draw();
}
function drawPose(x, y, yaw, color, label, big) {
  const [sx, sy] = worldToScreen(x, y);
  const len = big ? 30 : 24;
  const ex = sx + Math.cos(yaw) * len, ey = sy - Math.sin(yaw) * len;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  const a = Math.atan2(ey - sy, ex - sx);
  ctx.beginPath(); ctx.moveTo(ex, ey);
  ctx.lineTo(ex - 8 * Math.cos(a - 0.45), ey - 8 * Math.sin(a - 0.45));
  ctx.lineTo(ex - 8 * Math.cos(a + 0.45), ey - 8 * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(sx, sy, big ? 8 : 6.5, 0, Math.PI * 2);
  ctx.fillStyle = "#fff"; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
  if (label) {
    ctx.font = "600 13px system-ui, sans-serif";
    const w = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(sx + 10, sy + 6, w + 8, 19);
    ctx.fillStyle = color; ctx.fillText(label, sx + 14, sy + 20);
  }
}
function draw() {
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (!mapImage) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mapImage, view.ox, view.oy, map.width * view.scale, map.height * view.scale);
  // 地图原点（x=0, y=0）
  const [zx, zy] = worldToScreen(0, 0);
  ctx.strokeStyle = "rgba(220,38,38,.8)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(zx - 8, zy); ctx.lineTo(zx + 8, zy); ctx.moveTo(zx, zy - 8); ctx.lineTo(zx, zy + 8); ctx.stroke();
  for (const p of places) {
    const sel = p.id === selectedId, hit = p.id === searchHitId;
    drawPose(p.pose.x, p.pose.y, p.pose.yaw, sel ? getCss("--selected") : hit ? getCss("--hit") : getCss("--accent"), p.title, sel || hit);
  }
  if (pending) drawPose(pending.pose.x, pending.pose.y, pending.pose.yaw, getCss("--selected"), pending.title || "新地点", true);
  if (drag && drag.kind === "pose") {
    const [x, y] = drag.start, yaw = dragYaw(drag);
    drawPose(x, y, yaw, getCss("--selected"), null, true);
  }
}
const getCss = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------- 鼠标 / 触屏 ----------
function eventPos(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hitTest(sx, sy) {
  let best = null, bestD = HIT_RADIUS;
  for (const p of places) {
    const [px, py] = worldToScreen(p.pose.x, p.pose.y);
    const d = Math.hypot(px - sx, py - sy);
    if (d < bestD) { best = p; bestD = d; }
  }
  return best;
}
function dragYaw(d) {
  const dx = d.cur[0] - d.startScreen[0], dy = d.cur[1] - d.startScreen[1];
  if (Math.hypot(dx, dy) < 8) return d.defaultYaw;   // 只点了一下没拖：保持原朝向（新地点默认 0，朝 x 正方向）
  return Math.atan2(-dy, dx);                         // 屏幕 y 向下，地图 y 向上
}
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointerdown", (e) => {
  if (!map) return;
  canvas.setPointerCapture(e.pointerId);
  const [sx, sy] = eventPos(e);
  if (e.button !== 0 || panMode) { drag = { kind: "pan", last: [sx, sy] }; return; }
  const hit = replacing ? null : hitTest(sx, sy);
  if (hit) {
    select(hit.id);
    drag = { kind: "move", place: hit, last: [sx, sy], moved: false };
    return;
  }
  const [u, v] = screenToImg(sx, sy);
  const sel = places.find((p) => p.id === selectedId);
  drag = { kind: "pose", start: imgToWorld(u, v), startScreen: [sx, sy], cur: [sx, sy],
           defaultYaw: replacing && sel ? sel.pose.yaw : 0 };
  draw();
});
canvas.addEventListener("pointermove", (e) => {
  if (!map) return;
  const [sx, sy] = eventPos(e);
  const [x, y] = imgToWorld(...screenToImg(sx, sy));
  $("coords").textContent = `x=${x.toFixed(2)}  y=${y.toFixed(2)} m`;
  if (!drag) return;
  if (drag.kind === "pan") {
    view.ox += sx - drag.last[0]; view.oy += sy - drag.last[1]; drag.last = [sx, sy]; draw();
  } else if (drag.kind === "move") {
    if (!drag.moved && Math.hypot(sx - drag.last[0], sy - drag.last[1]) < 4) return;
    drag.moved = true;
    drag.place.pose.x = round(x); drag.place.pose.y = round(y);
    markDirty(); fillForm(drag.place); draw();
  } else if (drag.kind === "pose") {
    drag.cur = [sx, sy]; draw();
  }
});
canvas.addEventListener("pointerup", () => {
  if (drag && drag.kind === "pose") {
    const [x, y] = drag.start, yaw = round(normYaw(dragYaw(drag)));
    const sel = places.find((p) => p.id === selectedId);
    if (replacing && sel) {
      sel.pose = { x: round(x), y: round(y), yaw };
      replacing = false; $("btnReplace").classList.remove("active");
      markDirty(); fillForm(sel); renderList();
    } else {
      selectedId = null;
      pending = { title: "", description: "", pose: { x: round(x), y: round(y), yaw }, frame_id: "map" };
      showForm(); $("fTitle").focus();
    }
  }
  if (drag && drag.kind === "move" && drag.moved) renderList();
  drag = null; draw();
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const [sx, sy] = eventPos(e);
  const k = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.min(Math.max(view.scale * k, 0.2), 80);
  view.ox = sx - (sx - view.ox) * ns / view.scale;
  view.oy = sy - (sy - view.oy) * ns / view.scale;
  view.scale = ns; draw();
}, { passive: false });
window.addEventListener("resize", resize);

// ---------- 表单 ----------
function current() { return pending || places.find((p) => p.id === selectedId) || null; }
function select(id) {
  pending = null; selectedId = id; replacing = false; $("btnReplace").classList.remove("active");
  showForm(); renderList(); draw();
}
function fillForm(p) {
  $("fTitle").value = p.title; $("fDesc").value = p.description;
  $("fX").value = p.pose.x; $("fY").value = p.pose.y;
  $("fYaw").value = Math.round(p.pose.yaw * 180 / Math.PI);
  $("fWarn").textContent = cellWarning(p.pose.x, p.pose.y);
}
function showForm() {
  const p = current();
  $("form").hidden = !p; $("formEmpty").hidden = !!p;
  if (!p) { $("formTitle").textContent = "地点"; return; }
  $("formTitle").textContent = pending ? "新地点" : `编辑：${p.title}（id ${p.id}）`;
  $("btnAdd").hidden = !pending;
  $("btnReplace").hidden = $("btnDelete").hidden = !!pending;
  fillForm(p);
}
function readForm(p) {
  p.title = $("fTitle").value.trim(); p.description = $("fDesc").value.trim();
  const x = parseFloat($("fX").value), y = parseFloat($("fY").value), yawDeg = parseFloat($("fYaw").value);
  if (Number.isFinite(x)) p.pose.x = round(x);
  if (Number.isFinite(y)) p.pose.y = round(y);
  if (Number.isFinite(yawDeg)) p.pose.yaw = round(normYaw(yawDeg * Math.PI / 180));
  $("fWarn").textContent = cellWarning(p.pose.x, p.pose.y);
}
for (const id of ["fTitle", "fDesc", "fX", "fY", "fYaw"]) {
  $(id).addEventListener("input", () => {
    const p = current(); if (!p) return;
    readForm(p);
    if (!pending) { markDirty(); renderList(); $("formTitle").textContent = `编辑：${p.title}（id ${p.id}）`; }
    draw();
  });
}
$("btnAdd").onclick = () => {
  readForm(pending);
  if (!pending.title || !pending.description) { setStatus("名称和描述都要填", "err"); return; }
  if (places.some((p) => p.title === pending.title)) { setStatus(`已经有叫"${pending.title}"的地点了`, "err"); return; }
  pending.id = places.reduce((m, p) => Math.max(m, p.id), 0) + 1;
  places.push(pending);
  const id = pending.id; pending = null;
  markDirty(); select(id); setStatus(`已添加"${places.at(-1).title}"，记得点"保存"`, "ok");
};
$("btnCancel").onclick = () => { pending = null; selectedId = null; replacing = false; showForm(); renderList(); draw(); };
$("btnDelete").onclick = () => {
  const p = current(); if (!p || !confirm(`删除"${p.title}"？`)) return;
  places = places.filter((q) => q.id !== p.id); selectedId = null;
  markDirty(); showForm(); renderList(); draw();
};
$("btnReplace").onclick = () => {
  replacing = !replacing; $("btnReplace").classList.toggle("active", replacing);
  setStatus(replacing ? "在地图上重新拖一下，放到新位置" : "");
};

// ---------- 列表 / 保存 / 重建 / 搜索 ----------
function renderList() {
  $("count").textContent = `（${places.length}）`;
  const ul = $("list"); ul.innerHTML = "";
  for (const p of places) {
    const li = document.createElement("li");
    li.className = p.id === selectedId ? "sel" : "";
    const warn = cellWarning(p.pose.x, p.pose.y) ? " ⚠" : "";
    li.innerHTML = `<div class="t"></div><div class="c"></div>`;
    li.querySelector(".t").textContent = `${p.title}${warn}`;
    li.querySelector(".c").textContent =
      `x=${p.pose.x}  y=${p.pose.y}  朝向=${Math.round(p.pose.yaw * 180 / Math.PI)}°`;
    li.onclick = () => { select(p.id); centerOn(p); };
    ul.appendChild(li);
  }
}
function centerOn(p) {
  const r = canvas.getBoundingClientRect(), [sx, sy] = worldToScreen(p.pose.x, p.pose.y);
  view.ox += r.width / 2 - sx; view.oy += r.height / 2 - sy; draw();
}
function markDirty() { dirty = true; $("btnSave").disabled = false; $("dirty").textContent = "有未保存的修改"; }
function setStatus(text, cls = "") { $("status").textContent = text; $("status").className = cls; }

$("btnSave").onclick = async () => {
  try {
    const r = await api("/api/places", { places });
    dirty = false; $("btnSave").disabled = true; $("dirty").textContent = "";
    setStatus(`已保存 ${r.count} 个地点。要让搜索用上新数据，再点"重建语义库"`, "ok");
  } catch (e) { setStatus(`保存失败：${e.message}`, "err"); }
};
$("btnRebuild").onclick = async () => {
  if (dirty && !confirm("有未保存的修改，重建只会用已保存的内容。继续？")) return;
  $("btnRebuild").disabled = true; setStatus("正在重建（第一次要加载模型，可能要十几秒到一分钟）…");
  try {
    const r = await api("/api/rebuild", {});
    setStatus(`语义库已重建：${r.count} 个地点写入 ${r.collection}`, "ok");
  } catch (e) { setStatus(`重建失败：${e.message}`, "err"); }
  $("btnRebuild").disabled = false;
};
async function doSearch() {
  const q = $("q").value.trim(); if (!q) return;
  $("searchResult").textContent = "搜索中…";
  try {
    const r = await api("/api/search", { query: q });
    const top = r.candidates.map((c) => `${c.title} ${c.score.toFixed(3)}`).join("，");
    if (r.found) {
      searchHitId = r.best.id;
      $("searchResult").innerHTML = "";
      const b = document.createElement("b"); b.textContent = `→ ${r.best.title}`;
      $("searchResult").append(b, `（x=${r.best.x}, y=${r.best.y}）  候选：${top}`);
      const p = places.find((x) => x.id === r.best.id); if (p) centerOn(p);
    } else {
      searchHitId = null;
      $("searchResult").textContent = `没找到匹配的地点（机器人不会动）。候选：${top || "无"}`;
    }
    draw();
  } catch (e) { $("searchResult").textContent = `搜索失败：${e.message}`; }
}
$("btnSearch").onclick = doSearch;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
$("btnFit").onclick = fit;
$("btnPan").onclick = () => { panMode = !panMode; $("btnPan").classList.toggle("active", panMode); };
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

init().catch((e) => setStatus(`加载失败：${e.message}`, "err"));
</script>
</body>
</html>
